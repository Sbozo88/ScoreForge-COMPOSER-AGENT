services:
  preview:
    build:
      context: ..
      dockerfile: converter/Preview.Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      CONVERTER_URL: http://score-converter:8080
      CONVERTER_SECRET: ${CONVERTER_SECRET:?Set a random secret of at least 32 characters}
    depends_on:
      score-converter:
        condition: service_healthy
  score-converter:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      CONVERTER_SECRET: ${CONVERTER_SECRET:?Set a random secret of at least 32 characters}
      OMR_TIMEOUT: "14400"
    volumes:
      - scores:/data
    mem_limit: 10g
    cpus: 4
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,urllib.request; r=urllib.request.Request('http://localhost:8080/health',headers={'Authorization':'Bearer '+os.environ['CONVERTER_SECRET']}); assert json.load(urllib.request.urlopen(r,timeout=5))['ready']"]
      interval: 30s
      timeout: 10s
      start_period: 60s
volumes:
  scores:
