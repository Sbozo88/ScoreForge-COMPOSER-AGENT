<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private studio · Music Pulse Collective</title><style>body{margin:0;background:#000a16;color:#f5f4ef;font:17px/1.7 system-ui;min-height:100dvh;display:grid;place-items:center}main{max-width:460px;padding:36px}small{color:#d4a83a;letter-spacing:.15em}h1{font-size:48px;line-height:1.1;font-weight:500}button{background:#b08300;color:white;padding:16px 24px;border:0;border-radius:10px;font:inherit;cursor:pointer}button:disabled{opacity:.5}p{color:#ffffffb3}#status{min-height:3em}button:focus-visible{outline:3px solid white;outline-offset:4px}</style></head><body><main><small>MUSIC PULSE COLLECTIVE · PRIVATE</small><h1>A space for your music.</h1><p>This studio is reserved for its owner. Sign in with your approved Google account to continue.</p><button id="signin" disabled>Sign in with Google</button><p id="status" role="status">Preparing secure sign-in…</p><p>No public registration. No payments.</p></main><script src="/__/firebase/12.6.0/firebase-app-compat.js"></script><script src="/__/firebase/12.6.0/firebase-auth-compat.js"></script><script>
(async()=>{const button=document.querySelector('#signin'),status=document.querySelector('#status');try{const r=await fetch('/__/firebase/init.json');if(!r.ok)throw Error();firebase.initializeApp(await r.json());const auth=firebase.auth();await auth.setPersistence(firebase.auth.Auth.Persistence.NONE);button.disabled=false;status.textContent='';button.onclick=async()=>{button.disabled=true;status.textContent='Opening Google sign-in…';try{const provider=new firebase.auth.GoogleAuthProvider();provider.setCustomParameters({prompt:'select_account'});const result=await auth.signInWithPopup(provider);const response=await fetch('/session/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idToken:await result.user.getIdToken(true)})});await auth.signOut();if(!response.ok){status.textContent=response.status===403?'Access is restricted to the studio owner.':'Sign-in could not complete. Check the studio configuration and try again.';return}location.replace('/workspace/')}catch{status.textContent='Sign-in did not complete. Allow the sign-in window and try again.';await auth.signOut().catch(()=>{})}finally{button.disabled=false}}}catch{status.textContent='Private access is closed until Firebase sign-in is configured.'}})();
</script></body></html>
